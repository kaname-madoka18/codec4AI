name: Build and verify wheel

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-cp312:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system build and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config git patch perl xz-utils ffmpeg
      - name: Install Python build tools
        run: python -m pip install -r tools/build-requirements.txt
      - name: Test build helpers
        run: python -m unittest discover -s tools/tests -p 'test_*.py' -v
      - name: Cache verified source archives
        uses: actions/cache@v4
        with:
          path: |
            /tmp/codec4ai-downloads/*.tar.gz
            /tmp/codec4ai-downloads/*.tar.xz
          key: codec4ai-sources-v1-${{ runner.os }}-${{ hashFiles('tools/sources.json') }}
      - name: Build release files
        env:
          BUILD_ROOT: /tmp/codec4ai-build
          SOURCE_CACHE: /tmp/codec4ai-downloads
          BUILD_JOBS: '2'
        run: bash tools/build_release.sh
      - name: Test installed wheel in a fresh environment
        run: |
          wheels=(releases/*/*.whl)
          test "${#wheels[@]}" -eq 1
          python tools/verify_release.py "${wheels[0]}" --junit-xml /tmp/codec4ai-tests.xml
      - uses: actions/upload-artifact@v4
        with:
          name: video-loader-linux-cp312
          path: |
            releases/*/
            /tmp/codec4ai-tests.xml
      - name: Upload failed download diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: codec4ai-download-diagnostics
          path: /tmp/codec4ai-downloads/diagnostics/
          if-no-files-found: ignore
          retention-days: 7
